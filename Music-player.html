<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music Player</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#14101f;--panel:#1f1830;--ink:#f4efff;--muted:#9a90b5;--accent:#ff7a59;--line:#352b4d}
*{box-sizing:border-box;margin:0}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:16px}
.player{display:grid;grid-template-columns:340px 1fr;gap:28px;background:var(--panel);border-radius:20px;padding:28px;width:100%;max-width:820px}
@media(max-width:700px){.player{grid-template-columns:1fr;padding:20px}}
.art{aspect-ratio:1;border-radius:14px;display:grid;place-items:center;font:800 4rem 'Syne',sans-serif;color:rgba(255,255,255,.85);transition:background .4s}
h1{font:800 1.5rem 'Syne',sans-serif;margin-top:16px}
.artist{color:var(--muted)}
.ctrl{display:flex;flex-direction:column}
.progress{display:flex;align-items:center;gap:10px;margin:16px 0;font-size:.85rem;color:var(--muted)}
input[type=range]{-webkit-appearance:none;appearance:none;height:5px;border-radius:3px;background:var(--line);width:100%;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:var(--accent)}
.btns{display:flex;justify-content:center;align-items:center;gap:14px}
button{background:none;border:0;color:var(--ink);cursor:pointer;font-size:1.3rem;padding:8px;border-radius:50%}
button:hover{background:var(--line)}
button.on{color:var(--accent)}
button.play{background:var(--accent);color:#14101f;width:56px;height:56px;font-size:1.4rem}
:focus-visible{outline:3px solid #ffd166;outline-offset:2px}
.vol{display:flex;align-items:center;gap:8px;margin:12px auto 0;max-width:220px}
ul{list-style:none;padding:0;margin-top:18px;max-height:200px;overflow:auto;border-top:1px solid var(--line)}
li{display:flex;align-items:center;gap:10px;padding:10px 6px;border-bottom:1px solid var(--line);cursor:pointer}
li.active{color:var(--accent)}
li span.t{flex:1}
li small{color:var(--muted)}
li button{font-size:1.05rem;padding:4px}
.opts{display:flex;justify-content:center;gap:6px;margin-top:6px}
.opts button{font-size:.85rem;border-radius:20px;padding:6px 12px;border:1px solid var(--line)}
</style>
</head>
<body>
<main class="player">
  <div>
    <div class="art" id="art"></div>
    <h1 id="title">—</h1>
    <p class="artist" id="artist">—</p>
  </div>

  <div class="ctrl">
    <div class="progress">
      <span id="cur">0:00</span>
      <input type="range" id="seek" min="0" max="100" value="0" step="0.1" aria-label="Seek">
      <span id="dur">0:00</span>
    </div>

    <div class="btns">
      <button id="prev" aria-label="Previous">⏮</button>
      <button id="play" class="play" aria-label="Play">▶</button>
      <button id="next" aria-label="Next">⏭</button>
    </div>

    <div class="opts">
      <button id="shuffle">Shuffle</button>
      <button id="repeat">Repeat: off</button>
      <button id="auto" class="on">Autoplay: on</button>
    </div>

    <div class="vol">
      <button id="mute" aria-label="Mute">🔊</button>
      <input type="range" id="vol" min="0" max="1" step="0.01" value="0.8" aria-label="Volume">
    </div>

    <ul id="list"></ul>
  </div>
  <audio id="audio" preload="metadata"></audio>
</main>

<script>
const songs=[
 {title:'Neon Drift',artist:'SoundHelix',c:['#ff7a59','#7b2ff7'],src:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3'},
 {title:'Paper Lanterns',artist:'SoundHelix',c:['#2ec4b6','#1b3b6f'],src:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3'},
 {title:'Slow Orbit',artist:'SoundHelix',c:['#ffd166','#ef476f'],src:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3'},
 {title:'Glass Rain',artist:'SoundHelix',c:['#06d6a0','#118ab2'],src:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3'},
 {title:'Night Bus',artist:'SoundHelix',c:['#f72585','#3a0ca3'],src:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3'}
];
const $=id=>document.getElementById(id);
const a=$('audio');
let i=0,shuffle=false,repeat=0,auto=true,lastVol=0.8; // repeat: 0 off, 1 all, 2 one
let favs=[];try{favs=JSON.parse(localStorage.getItem('favs'))||[]}catch(e){}
const fmt=s=>isFinite(s)?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'0:00';
const durs={};

function load(n,play){
  i=n;const s=songs[i];
  a.src=s.src;
  $('title').textContent=s.title;$('artist').textContent=s.artist;
  $('art').style.background=`linear-gradient(135deg,${s.c[0]},${s.c[1]})`;
  $('art').textContent=s.title[0];
  $('seek').value=0;$('cur').textContent='0:00';$('dur').textContent='0:00';
  renderList();
  if(play)a.play().catch(()=>{});
}
function renderList(){
  $('list').innerHTML=songs.map((s,n)=>`
    <li class="${n===i?'active':''}" onclick="load(${n},true)">
      <span class="t">${s.title}</span><small>${durs[n]?fmt(durs[n]):''}</small>
      <button class="${favs.includes(n)?'on':''}" onclick="event.stopPropagation();fav(${n})" aria-label="Favourite">${favs.includes(n)?'♥':'♡'}</button>
    </li>`).join('');
}
function fav(n){favs=favs.includes(n)?favs.filter(x=>x!==n):[...favs,n];
  try{localStorage.setItem('favs',JSON.stringify(favs))}catch(e){}renderList()}
function next(){
  if(shuffle&&songs.length>1){let n;do{n=Math.floor(Math.random()*songs.length)}while(n===i);load(n,true)}
  else load((i+1)%songs.length,true);
}
function prev(){if(a.currentTime>3)a.currentTime=0;else load((i-1+songs.length)%songs.length,true)}

$('play').onclick=()=>a.paused?a.play():a.pause();
$('next').onclick=next;$('prev').onclick=prev;
a.onplay=()=>{$('play').textContent='⏸';$('play').setAttribute('aria-label','Pause')};
a.onpause=()=>{$('play').textContent='▶';$('play').setAttribute('aria-label','Play')};
a.onloadedmetadata=()=>{durs[i]=a.duration;$('dur').textContent=fmt(a.duration);renderList()};
a.ontimeupdate=()=>{if(a.duration){$('seek').value=a.currentTime/a.duration*100;$('cur').textContent=fmt(a.currentTime)}};
$('seek').oninput=e=>{if(a.duration)a.currentTime=e.target.value/100*a.duration};
a.onended=()=>{
  if(repeat===2){a.currentTime=0;a.play()}
  else if(i===songs.length-1&&repeat===0&&!shuffle){a.pause()}
  else if(auto)next();
};
$('vol').oninput=e=>{a.volume=e.target.value;a.muted=a.volume==0;$('mute').textContent=a.muted?'🔇':'🔊'};
$('mute').onclick=()=>{a.muted=!a.muted;$('mute').textContent=a.muted?'🔇':'🔊'};
$('shuffle').onclick=e=>{shuffle=!shuffle;e.target.classList.toggle('on',shuffle)};
$('repeat').onclick=e=>{repeat=(repeat+1)%3;e.target.textContent='Repeat: '+['off','all','one'][repeat];e.target.classList.toggle('on',repeat>0)};
$('auto').onclick=e=>{auto=!auto;e.target.textContent='Autoplay: '+(auto?'on':'off');e.target.classList.toggle('on',auto)};

a.volume=0.8;
load(0,false);
</script>
</body>
</html>
